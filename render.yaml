# Render blueprint — https://render.com/docs/blueprint-spec
# Create the web service from this repo (Dashboard → New → Blueprint) or via:
#   render blueprint launch
#
# Secret env vars (`sync: false`) are NOT stored in git. After the service is
# created, set them in Dashboard → Env. At minimum: APP_SECRET_KEY, DATABASE_URL,
# GROQ_API_KEY, BACKEND_URL, CLOUD_TASKS_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY.
services:
  - type: web
    name: garmin-ai-coach-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://your-domain.example,http://localhost:5174,http://localhost:3000,http://localhost:8000
      - key: APP_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CLOUD_TASKS_SECRET
        sync: false
